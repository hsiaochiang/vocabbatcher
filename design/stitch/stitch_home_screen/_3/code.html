<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3c83f6",
                        "background-light": "#f5f7f8",
                        "background-dark": "#101722",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100">
<div class="relative flex min-h-screen w-full flex-col max-w-md mx-auto shadow-2xl bg-background-light dark:bg-background-dark">
<!-- Header -->
<header class="flex items-center p-4 pt-6 gap-4">
<a class="flex h-10 w-10 items-center justify-center rounded-full bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300" href="#">
<span class="material-symbols-outlined">arrow_back</span>
</a>
<div class="flex flex-col">
<h1 class="text-xl font-bold tracking-tight">批次 #43</h1>
<p class="text-sm text-slate-500 dark:text-slate-400">待掌握的 25 個單字</p>
</div>
</header>
<!-- Progress Card (Contextual) -->
<div class="px-4 py-2">
<div class="bg-primary/10 dark:bg-primary/20 border border-primary/20 p-4 rounded-xl">
<div class="flex justify-between items-end mb-2">
<span class="text-xs font-semibold text-primary uppercase tracking-wider">整體進度</span>
<span class="text-sm font-bold text-primary">64%</span>
</div>
<div class="w-full bg-slate-200 dark:bg-slate-700 h-2 rounded-full overflow-hidden">
<div class="bg-primary h-full w-[64%]"></div>
</div>
</div>
</div>
<!-- Main Grid Area -->
<main class="flex-1 p-4">
<div class="grid grid-cols-2 gap-4 h-full content-start">
<!-- Audio Player -->
<button class="aspect-square flex flex-col items-center justify-center gap-4 rounded-xl bg-white dark:bg-slate-800 shadow-sm border border-slate-200 dark:border-slate-700 active:scale-95 transition-transform">
<div class="w-14 h-14 rounded-full bg-blue-50 dark:bg-blue-900/30 flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-3xl">volume_up</span>
</div>
<div class="text-center">
<span class="block font-bold text-slate-800 dark:text-slate-100">錄音播放器</span>
<span class="text-[10px] text-slate-400 dark:text-slate-500 uppercase font-medium">Listening mode</span>
</div>
</button>
<!-- Vocab Cards -->
<button class="aspect-square flex flex-col items-center justify-center gap-4 rounded-xl bg-white dark:bg-slate-800 shadow-sm border border-slate-200 dark:border-slate-700 active:scale-95 transition-transform">
<div class="w-14 h-14 rounded-full bg-purple-50 dark:bg-purple-900/30 flex items-center justify-center text-purple-600 dark:text-purple-400">
<span class="material-symbols-outlined text-3xl">layers</span>
</div>
<div class="text-center">
<span class="block font-bold text-slate-800 dark:text-slate-100">單字翻牌卡</span>
<span class="text-[10px] text-slate-400 dark:text-slate-500 uppercase font-medium">Flashcards</span>
</div>
</button>
<!-- Practice Quiz -->
<button class="aspect-square flex flex-col items-center justify-center gap-4 rounded-xl bg-white dark:bg-slate-800 shadow-sm border border-slate-200 dark:border-slate-700 active:scale-95 transition-transform">
<div class="w-14 h-14 rounded-full bg-emerald-50 dark:bg-emerald-900/30 flex items-center justify-center text-emerald-600 dark:text-emerald-400">
<span class="material-symbols-outlined text-3xl">edit_square</span>
</div>
<div class="text-center">
<span class="block font-bold text-slate-800 dark:text-slate-100">測驗練習</span>
<span class="text-[10px] text-slate-400 dark:text-slate-500 uppercase font-medium">Test yourself</span>
</div>
</button>
<!-- Statistics -->
<button class="aspect-square flex flex-col items-center justify-center gap-4 rounded-xl bg-white dark:bg-slate-800 shadow-sm border border-slate-200 dark:border-slate-700 active:scale-95 transition-transform">
<div class="w-14 h-14 rounded-full bg-orange-50 dark:bg-orange-900/30 flex items-center justify-center text-orange-600 dark:text-orange-400">
<span class="material-symbols-outlined text-3xl">bar_chart</span>
</div>
<div class="text-center">
<span class="block font-bold text-slate-800 dark:text-slate-100">統計數據</span>
<span class="text-[10px] text-slate-400 dark:text-slate-500 uppercase font-medium">Performance</span>
</div>
</button>
</div>
<!-- Additional Activity Feed or Tips -->
<div class="mt-8 space-y-4">
<h3 class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest px-1">批次洞察</h3>
<div class="bg-white dark:bg-slate-800 p-4 rounded-xl flex items-center gap-4 border border-slate-200 dark:border-slate-700">
<div class="bg-primary/10 text-primary p-2 rounded-lg">
<span class="material-symbols-outlined">trending_up</span>
</div>
<div>
<p class="text-sm font-semibold">你做得很好！</p>
<p class="text-xs text-slate-500 dark:text-slate-400">已有 8 個單字完全掌握。</p>
</div>
</div>
</div>
</main>
<!-- Bottom Navigation -->
<nav class="sticky bottom-0 border-t border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md px-4 pb-6 pt-2 flex justify-around items-center">
<a class="flex flex-col items-center gap-1 text-slate-400 dark:text-slate-500 transition-colors hover:text-primary" href="#">
<span class="material-symbols-outlined">home</span>
<span class="text-[10px] font-bold">首頁</span>
</a>
<a class="flex flex-col items-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">folder</span>
<span class="text-[10px] font-bold">批次</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400 dark:text-slate-500 transition-colors hover:text-primary" href="#">
<span class="material-symbols-outlined">person</span>
<span class="text-[10px] font-bold">個人檔案</span>
</a>
</nav>
</div>
</body></html>
