<!DOCTYPE html>

<html lang="zh-TW"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>錄音播放器 - 單字</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3c83f6",
                        "background-light": "#f5f7f8",
                        "background-dark": "#101722",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .filled-icon {
            font-variation-settings: 'FILL' 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<!-- Top Navigation Header -->
<header class="flex items-center px-4 py-4 justify-between border-b border-slate-200 dark:border-slate-800">
<button class="flex size-10 items-center justify-center rounded-full hover:bg-slate-200/50 dark:hover:bg-slate-800/50">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h2 class="text-lg font-bold flex-1 text-center">錄音播放器</h2>
<button class="flex size-10 items-center justify-center rounded-full hover:bg-slate-200/50 dark:hover:bg-slate-800/50">
<span class="material-symbols-outlined">settings</span>
</button>
</header>
<main class="flex-1 flex flex-col overflow-y-auto">
<!-- Interval Settings Section -->
<div class="px-6 py-6">
<h3 class="text-sm font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-4">單字播放間隔</h3>
<div class="flex gap-3">
<button class="flex-1 py-2 px-4 rounded-lg bg-primary text-white font-medium flex items-center justify-center shadow-sm">3秒</button>
<button class="flex-1 py-2 px-4 rounded-lg bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-medium flex items-center justify-center hover:bg-slate-300 dark:hover:bg-slate-700">5秒</button>
<button class="flex-1 py-2 px-4 rounded-lg bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-medium flex items-center justify-center hover:bg-slate-300 dark:hover:bg-slate-700">10秒</button>
</div>
</div>
<!-- Current Word Display -->
<div class="flex-1 flex flex-col items-center justify-center px-6 py-10 text-center">
<h1 class="text-5xl font-bold tracking-tight mb-4 text-primary">朝生暮死 (短暫的)</h1>
<p class="text-2xl font-medium text-slate-500 dark:text-slate-400">Ephemeral (əˈfem(ə)rəl)</p>
<div class="mt-4 flex items-center gap-2 text-slate-400">
<span class="material-symbols-outlined text-sm">volume_up</span>
<span class="text-sm font-medium italic">/əˈfem(ə)rəl/</span>
</div>
</div>
<!-- Progress & Controls -->
<div class="px-6 pb-8">
<div class="flex justify-between items-center mb-2">
<span class="text-xs font-bold text-slate-500">第 5 / 25 個單字</span>
<span class="text-xs font-bold text-slate-500">20% 已完成</span>
</div>
<div class="w-full bg-slate-200 dark:bg-slate-800 h-2 rounded-full mb-8 overflow-hidden">
<div class="bg-primary h-full w-1/5 rounded-full"></div>
</div>
<!-- Playback Controls -->
<div class="flex items-center justify-center gap-8">
<button class="text-slate-600 dark:text-slate-300 hover:text-primary transition-colors">
<span class="material-symbols-outlined !text-4xl">skip_previous</span>
</button>
<button class="bg-primary text-white w-20 h-20 rounded-full flex items-center justify-center shadow-lg shadow-primary/30 hover:scale-105 transition-transform">
<span class="material-symbols-outlined filled-icon !text-5xl">pause</span>
</button>
<button class="text-slate-600 dark:text-slate-300 hover:text-primary transition-colors">
<span class="material-symbols-outlined !text-4xl">skip_next</span>
</button>
</div>
</div>
<!-- Batch Word List -->
<div class="bg-white dark:bg-slate-900 rounded-t-3xl border-t border-slate-200 dark:border-slate-800 flex-1">
<div class="p-6">
<div class="flex justify-between items-center mb-4">
<h4 class="font-bold text-slate-800 dark:text-slate-200">目前批次</h4>
<span class="text-xs text-primary font-bold">25 個單字</span>
</div>
<div class="space-y-1">
<div class="flex items-center justify-between p-3 rounded-xl bg-slate-100 dark:bg-slate-800 border-l-4 border-primary">
<div class="flex flex-col">
<span class="font-bold text-slate-900 dark:text-white">5. 朝生暮死</span>
<span class="text-sm text-slate-500">短暫的</span>
</div>
<span class="material-symbols-outlined text-primary filled-icon">graphic_eq</span>
</div>
<div class="flex items-center justify-between p-3 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-800/50">
<div class="flex flex-col">
<span class="font-medium text-slate-700 dark:text-slate-300">6. Resilient</span>
<span class="text-sm text-slate-500">有彈性的</span>
</div>
<span class="material-symbols-outlined text-slate-300">play_circle</span>
</div>
<div class="flex items-center justify-between p-3 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-800/50">
<div class="flex flex-col">
<span class="font-medium text-slate-700 dark:text-slate-300">7. Eloquent</span>
<span class="text-sm text-slate-500">雄辯的</span>
</div>
<span class="material-symbols-outlined text-slate-300">play_circle</span>
</div>
</div>
</div>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="flex border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 px-4 pb-4 pt-2">
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-slate-500 dark:text-slate-400" href="#">
<span class="material-symbols-outlined">auto_stories</span>
<p class="text-[10px] font-bold">學習</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-slate-500 dark:text-slate-400" href="#">
<span class="material-symbols-outlined">refresh</span>
<p class="text-[10px] font-bold">複習</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined filled-icon">headphones</span>
<p class="text-[10px] font-bold">音訊</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-slate-500 dark:text-slate-400" href="#">
<span class="material-symbols-outlined">person</span>
<p class="text-[10px] font-bold">個人檔案</p>
</a>
</nav>
</body></html>
