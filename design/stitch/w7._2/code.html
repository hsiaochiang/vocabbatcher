<!DOCTYPE html>

<html class="light" lang="zh-TW"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec5b13",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body { font-family: 'Public Sans', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #472724; }
    </style>
</head>
<body class="bg-slate-200 dark:bg-slate-950 font-display transition-colors duration-300">
<!-- Background Overlay (Simulating Task List behind Drawer) -->
<div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-0"></div>
<!-- W7: Task Drawer / Task Edit (Right Side) -->
<div class="fixed top-0 right-0 h-full w-full max-w-[480px] bg-background-light dark:bg-background-dark shadow-2xl z-50 flex flex-col border-l border-slate-200 dark:border-slate-800">
<!-- Header -->
<header class="flex items-center justify-between px-6 py-4 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/50">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary text-2xl">edit_note</span>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-tight">編輯任務</h2>
</div>
<button class="flex items-center justify-center rounded-full h-10 w-10 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 dark:text-slate-400 transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<!-- Form Content -->
<div class="flex-1 overflow-y-auto custom-scrollbar p-6 space-y-8">
<!-- Task Title Section -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-slate-700 dark:text-slate-300">任務標題 <span class="text-red-500">*</span></label>
<input class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all" placeholder="請輸入任務名稱..." type="text" value="跟進 2024 年度合約續約事宜"/>
<p class="text-xs text-red-500 hidden italic">此欄位必填</p>
</div>
<!-- Status Selection -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-slate-700 dark:text-slate-300">任務狀態</label>
<div class="relative">
<select class="w-full px-4 py-3 appearance-none rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary outline-none cursor-pointer">
<option value="todo">待處理 (To-do)</option>
<option selected="" value="in-progress">進行中 (In Progress)</option>
<option value="review">審核中 (Review)</option>
<option value="done">已完成 (Completed)</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">expand_more</span>
</div>
</div>
<!-- Due Date / Calendar Section -->
<div class="space-y-3">
<label class="block text-sm font-semibold text-slate-700 dark:text-slate-300">截止日期</label>
<div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-4 shadow-sm">
<div class="flex items-center justify-between mb-4 border-b border-slate-100 dark:border-slate-700 pb-3">
<button class="p-1 hover:bg-slate-100 dark:hover:bg-slate-700 rounded text-slate-500"><span class="material-symbols-outlined">chevron_left</span></button>
<span class="text-sm font-bold text-slate-800 dark:text-slate-200">2023年 12月</span>
<button class="p-1 hover:bg-slate-100 dark:hover:bg-slate-700 rounded text-slate-500"><span class="material-symbols-outlined">chevron_right</span></button>
</div>
<div class="grid grid-cols-7 text-center text-[11px] font-bold text-slate-400 mb-2">
<div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
</div>
<div class="grid grid-cols-7 gap-1">
<!-- Simplified Calendar Placeholder -->
<div class="h-8 flex items-center justify-center text-slate-300 text-sm">28</div>
<div class="h-8 flex items-center justify-center text-slate-300 text-sm">29</div>
<div class="h-8 flex items-center justify-center text-slate-300 text-sm">30</div>
<div class="h-8 flex items-center justify-center text-slate-800 dark:text-slate-200 text-sm hover:bg-slate-100 dark:hover:bg-slate-700 rounded cursor-pointer">1</div>
<div class="h-8 flex items-center justify-center text-slate-800 dark:text-slate-200 text-sm hover:bg-slate-100 dark:hover:bg-slate-700 rounded cursor-pointer">2</div>
<div class="h-8 flex items-center justify-center text-slate-800 dark:text-slate-200 text-sm hover:bg-slate-100 dark:hover:bg-slate-700 rounded cursor-pointer">3</div>
<div class="h-8 flex items-center justify-center text-slate-800 dark:text-slate-200 text-sm hover:bg-slate-100 dark:hover:bg-slate-700 rounded cursor-pointer">4</div>
<!-- Today / Selected -->
<div class="h-8 flex items-center justify-center bg-primary text-white text-sm rounded-full font-bold">5</div>
<div class="h-8 flex items-center justify-center text-slate-800 dark:text-slate-200 text-sm hover:bg-slate-100 dark:hover:bg-slate-700 rounded cursor-pointer">6</div>
<div class="h-8 flex items-center justify-center text-slate-800 dark:text-slate-200 text-sm hover:bg-slate-100 dark:hover:bg-slate-700 rounded cursor-pointer">7</div>
<!-- ... rest of month -->
<div class="h-8 flex items-center justify-center text-slate-800 dark:text-slate-200 text-sm">...</div>
<div class="h-8 flex items-center justify-center text-slate-800 dark:text-slate-200 text-sm">25</div>
<div class="h-8 flex items-center justify-center text-slate-800 dark:text-slate-200 text-sm">26</div>
<div class="h-8 flex items-center justify-center text-slate-800 dark:text-slate-200 text-sm">27</div>
<div class="h-8 flex items-center justify-center text-slate-800 dark:text-slate-200 text-sm">28</div>
<div class="h-8 flex items-center justify-center text-slate-800 dark:text-slate-200 text-sm">29</div>
<div class="h-8 flex items-center justify-center text-slate-800 dark:text-slate-200 text-sm">30</div>
<div class="h-8 flex items-center justify-center text-slate-800 dark:text-slate-200 text-sm">31</div>
</div>
</div>
</div>
<!-- Linked Contact -->
<div class="space-y-4">
<div class="flex items-center justify-between">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300 flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-lg">person_add</span>
                        關聯聯絡人
                    </label>
<button class="text-primary text-xs font-bold hover:underline">新增關聯</button>
</div>
<!-- Contact Card -->
<div class="flex items-center justify-between p-4 bg-white dark:bg-slate-800/50 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-primary/50 transition-colors group">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary font-bold">
                            陳
                        </div>
<div>
<p class="text-sm font-bold text-slate-900 dark:text-slate-100">陳小明 (Xiao-Ming Chen)</p>
<p class="text-xs text-slate-500 dark:text-slate-400">宏達國際電子股份有限公司 | 採購經理</p>
</div>
</div>
<div class="flex items-center gap-2">
<!-- Quick Action Drawer Link -->
<button class="p-2 text-slate-400 hover:text-primary transition-colors" title="查看聯絡人詳情">
<span class="material-symbols-outlined">open_in_new</span>
</button>
<button class="p-2 text-slate-400 hover:text-red-500 transition-colors" title="移除關聯">
<span class="material-symbols-outlined">delete_outline</span>
</button>
</div>
</div>
</div>
<!-- Validation Error Mockup (Hidden by default) -->
<div class="hidden p-4 rounded-xl bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-900/50 flex items-start gap-3">
<span class="material-symbols-outlined text-red-500">error</span>
<div>
<p class="text-sm font-bold text-red-800 dark:text-red-200">儲存失敗</p>
<p class="text-xs text-red-700 dark:text-red-300">請確認截止日期不可早於今日。</p>
</div>
</div>
</div>
<!-- Footer Actions -->
<footer class="p-6 border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 flex items-center justify-between gap-4">
<button class="flex-1 px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 font-bold text-sm hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
                取消
            </button>
<button class="flex-[2] px-4 py-3 rounded-xl bg-primary text-white font-bold text-sm shadow-lg shadow-primary/20 hover:brightness-110 active:scale-[0.98] transition-all">
                儲存變更
            </button>
</footer>
</div>
</body></html>
