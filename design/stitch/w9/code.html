<!DOCTYPE html>

<html class="light" lang="zh-Hant"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>W9 - 新增/編輯互動抽屜</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec5b13",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Public Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body { font-family: 'Public Sans', sans-serif; }
        .material-symbols-outlined { font-size: 20px; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #3c2f28; }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display">
<div class="flex h-screen w-full items-center justify-end overflow-hidden bg-slate-900/20 backdrop-blur-sm">
<!-- Interaction Drawer -->
<div class="h-full w-full max-w-md bg-white dark:bg-background-dark shadow-2xl flex flex-col border-l border-slate-200 dark:border-slate-800">
<!-- Header -->
<header class="flex items-center justify-between px-6 py-4 border-b border-slate-100 dark:border-slate-800">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary">edit_note</span>
<h2 class="text-xl font-bold tracking-tight">編輯互動記錄</h2>
</div>
<button class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<!-- Content Area (Scrollable) -->
<div class="flex-1 overflow-y-auto px-6 py-4 space-y-6">
<!-- Basic Info Section -->
<section class="space-y-4">
<div class="flex items-center gap-2 mb-2">
<span class="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">基本資訊</span>
<div class="h-[1px] flex-1 bg-slate-100 dark:bg-slate-800"></div>
</div>
<div class="grid grid-cols-1 gap-4">
<!-- Datetime -->
<div>
<label class="block text-sm font-semibold mb-1.5 flex items-center gap-1">
                                日期與時間 <span class="text-primary">*</span>
</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">calendar_today</span>
<input class="w-full pl-10 pr-4 py-2.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none" type="datetime-local" value="2023-10-27T14:30"/>
</div>
</div>
<!-- Interaction Type -->
<div>
<label class="block text-sm font-semibold mb-1.5 flex items-center gap-1">
                                互動類型 <span class="text-primary">*</span>
</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">category</span>
<select class="w-full pl-10 pr-4 py-2.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none appearance-none">
<option value="call">電話會議</option>
<option value="meeting">實體面談</option>
<option value="email">電子郵件</option>
<option value="social">社群軟體</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">expand_more</span>
</div>
</div>
</div>
</section>
<!-- Detailed Content Section -->
<section class="space-y-4">
<!-- Raw Notes -->
<div>
<label class="block text-sm font-semibold mb-1.5 flex items-center gap-1">
                            原始備註 <span class="text-primary">*</span>
</label>
<textarea class="w-full p-4 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none resize-none" placeholder="輸入會議記錄、對話摘要或原始筆記..." rows="4"></textarea>
</div>
<!-- Tags -->
<div>
<label class="block text-sm font-semibold mb-1.5">標籤</label>
<div class="flex flex-wrap gap-2 mb-2">
<span class="inline-flex items-center gap-1 px-3 py-1 bg-primary/10 text-primary text-xs font-bold rounded-full">
                                產品提案 <button><span class="material-symbols-outlined !text-[14px]">close</span></button>
</span>
<span class="inline-flex items-center gap-1 px-3 py-1 bg-primary/10 text-primary text-xs font-bold rounded-full">
                                季度回顧 <button><span class="material-symbols-outlined !text-[14px]">close</span></button>
</span>
<button class="inline-flex items-center gap-1 px-3 py-1 border border-dashed border-slate-300 dark:border-slate-600 text-slate-500 text-xs font-bold rounded-full hover:border-primary hover:text-primary transition-colors">
<span class="material-symbols-outlined !text-[14px]">add</span> 新增
                            </button>
</div>
</div>
<!-- Follow-up Date -->
<div>
<label class="block text-sm font-semibold mb-1.5">下次追蹤日期</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">event_repeat</span>
<input class="w-full pl-10 pr-4 py-2.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none" type="date"/>
</div>
</div>
</section>
<!-- AI Section -->
<section class="space-y-4 pt-4">
<div class="flex items-center justify-between mb-2">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary">auto_awesome</span>
<span class="text-sm font-bold text-slate-700 dark:text-slate-300">AI 智慧處理</span>
</div>
<button class="text-xs font-bold bg-primary text-white px-3 py-1.5 rounded-lg hover:bg-primary/90 transition-colors flex items-center gap-1">
<span class="material-symbols-outlined !text-[14px]">bolt</span> 產生 AI 摘要
                        </button>
</div>
<div class="bg-primary/5 dark:bg-primary/10 border border-primary/20 rounded-xl p-4 space-y-4">
<!-- AI Summary -->
<div>
<p class="text-xs font-bold text-primary mb-1 tracking-wide">AI 摘要</p>
<p class="text-sm text-slate-600 dark:text-slate-400 leading-relaxed">
                                客戶對產品 X 的 Q4 報價表示興趣，但希望在交付週期上能縮短 2 週。目前初步同意下週三進行技術對接。
                            </p>
</div>
<!-- AI Actions List -->
<div>
<div class="flex items-center justify-between mb-2">
<p class="text-xs font-bold text-primary tracking-wide">後續行動項目</p>
<button class="text-[10px] font-bold text-primary hover:underline uppercase">從行動建立任務</button>
</div>
<ul class="space-y-2">
<li class="flex items-start gap-2 bg-white dark:bg-slate-800 p-2 rounded-lg border border-slate-100 dark:border-slate-700 shadow-sm">
<span class="material-symbols-outlined text-slate-400 !text-[16px] mt-0.5">check_circle</span>
<span class="text-xs text-slate-700 dark:text-slate-300">確認物流部門是否能提早 2 週交付</span>
</li>
<li class="flex items-start gap-2 bg-white dark:bg-slate-800 p-2 rounded-lg border border-slate-100 dark:border-slate-700 shadow-sm">
<span class="material-symbols-outlined text-slate-400 !text-[16px] mt-0.5">check_circle</span>
<span class="text-xs text-slate-700 dark:text-slate-300">寄送技術文件與 API 規格給客戶窗口</span>
</li>
<li class="flex items-start gap-2 bg-white dark:bg-slate-800 p-2 rounded-lg border border-slate-100 dark:border-slate-700 shadow-sm">
<span class="material-symbols-outlined text-slate-400 !text-[16px] mt-0.5">check_circle</span>
<span class="text-xs text-slate-700 dark:text-slate-300">安排下週三的技術對接會議</span>
</li>
</ul>
</div>
</div>
</section>
</div>
<!-- Footer Buttons -->
<footer class="p-6 border-t border-slate-100 dark:border-slate-800 flex items-center gap-3">
<button class="flex-1 py-2.5 px-4 rounded-xl border border-slate-200 dark:border-slate-700 font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
                    取消
                </button>
<button class="flex-[2] py-2.5 px-4 rounded-xl bg-primary text-white font-bold hover:bg-primary/90 shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined">save</span>
                    儲存變更
                </button>
</footer>
</div>
</div>
</body></html>
