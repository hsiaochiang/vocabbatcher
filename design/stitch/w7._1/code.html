<!DOCTYPE html>

<html class="light" lang="zh-Hant"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec5b13",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<title>編輯任務 - Task Drawer</title>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<div class="flex h-screen overflow-hidden">
<!-- Main Content Area Placeholder (Mocking the background behind drawer) -->
<div class="flex-1 p-8 opacity-40">
<h1 class="text-3xl font-bold mb-6">任務列表</h1>
<div class="space-y-4">
<div class="h-20 w-full bg-slate-200 dark:bg-slate-800 rounded-xl"></div>
<div class="h-20 w-full bg-slate-200 dark:bg-slate-800 rounded-xl"></div>
<div class="h-20 w-full bg-slate-200 dark:bg-slate-800 rounded-xl"></div>
</div>
</div>
<!-- Task Drawer Overlay Background -->
<div class="fixed inset-0 bg-black/20 backdrop-blur-sm z-40"></div>
<!-- Task Drawer (Right Side) -->
<div class="fixed right-0 top-0 h-full w-full max-w-md bg-white dark:bg-background-dark shadow-2xl z-50 flex flex-col border-l border-slate-200 dark:border-slate-800 transition-transform duration-300 transform translate-x-0">
<!-- Header -->
<header class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 px-6 py-4">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary">edit_square</span>
<h2 class="text-lg font-bold leading-tight tracking-tight">編輯任務</h2>
</div>
<button class="flex size-10 items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-slate-500">close</span>
</button>
</header>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto px-6 py-4 space-y-6">
<!-- Task Title -->
<div class="space-y-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300 flex items-center gap-1">
                        任務標題 <span class="text-primary">*</span>
</label>
<input class="w-full rounded-xl border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 focus:border-primary focus:ring-1 focus:ring-primary py-3 px-4 text-base transition-all" placeholder="請輸入任務名稱" type="text" value="開發 Q4 銷售報告介面"/>
</div>
<!-- Status Select -->
<div class="space-y-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300">目前狀態</label>
<div class="relative">
<select class="w-full appearance-none rounded-xl border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 focus:border-primary focus:ring-1 focus:ring-primary py-3 px-4 text-base">
<option value="todo">待處理 (To Do)</option>
<option selected="" value="in-progress">進行中 (In Progress)</option>
<option value="review">審核中 (Review)</option>
<option value="done">已完成 (Done)</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">unfold_more</span>
</div>
</div>
<!-- Due Date & Calendar Section -->
<div class="space-y-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300">截止日期</label>
<div class="border border-slate-200 dark:border-slate-700 rounded-xl p-4 bg-slate-50 dark:bg-slate-900/50">
<div class="flex items-center justify-between mb-4">
<button class="size-8 flex items-center justify-center rounded-lg hover:bg-white dark:hover:bg-slate-800 shadow-sm transition-all border border-slate-100 dark:border-slate-700">
<span class="material-symbols-outlined text-sm">chevron_left</span>
</button>
<span class="font-bold">2023年 10月</span>
<button class="size-8 flex items-center justify-center rounded-lg hover:bg-white dark:hover:bg-slate-800 shadow-sm transition-all border border-slate-100 dark:border-slate-700">
<span class="material-symbols-outlined text-sm">chevron_right</span>
</button>
</div>
<div class="grid grid-cols-7 text-center text-[11px] font-bold text-slate-400 mb-2">
<span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
</div>
<div class="grid grid-cols-7 gap-1">
<!-- Week 1 -->
<div class="h-8 flex items-center justify-center text-slate-300">26</div>
<div class="h-8 flex items-center justify-center text-slate-300">27</div>
<div class="h-8 flex items-center justify-center text-slate-300">28</div>
<div class="h-8 flex items-center justify-center text-slate-300">29</div>
<div class="h-8 flex items-center justify-center text-slate-300">30</div>
<button class="h-8 w-full rounded-lg text-sm hover:bg-primary/10 transition-colors">1</button>
<button class="h-8 w-full rounded-lg text-sm hover:bg-primary/10 transition-colors">2</button>
<!-- Week 2 -->
<button class="h-8 w-full rounded-lg text-sm hover:bg-primary/10 transition-colors">3</button>
<button class="h-8 w-full rounded-lg text-sm hover:bg-primary/10 transition-colors">4</button>
<button class="h-8 w-full rounded-lg bg-primary text-white text-sm font-bold shadow-lg shadow-primary/30">5</button>
<button class="h-8 w-full rounded-lg text-sm hover:bg-primary/10 transition-colors">6</button>
<button class="h-8 w-full rounded-lg text-sm hover:bg-primary/10 transition-colors">7</button>
<button class="h-8 w-full rounded-lg text-sm hover:bg-primary/10 transition-colors">8</button>
<button class="h-8 w-full rounded-lg text-sm hover:bg-primary/10 transition-colors">9</button>
<!-- Rest omitted for brevity -->
<div class="col-span-7 py-1 text-center text-[10px] text-slate-400 italic">選取的日期: 2023-10-05</div>
</div>
</div>
</div>
<!-- Linked Contact Section -->
<div class="space-y-2">
<div class="flex items-center justify-between">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300">關聯聯絡人</label>
<button class="text-xs text-primary font-bold flex items-center gap-1 hover:underline">
<span class="material-symbols-outlined text-[14px]">person_add</span>
                            更換聯絡人
                        </button>
</div>
<div class="flex items-center gap-3 p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 group cursor-pointer hover:border-primary/50 transition-all">
<div class="size-10 rounded-full bg-primary/10 flex items-center justify-center text-primary overflow-hidden">
<img alt="Contact Avatar" class="size-full object-cover" data-alt="User profile avatar with friendly face" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBats1moVCBoDaPZKBUDlVHgx6ses88wNLrloCNA2z8SPSRc2Cfj6A27_YexBbcMT-Ah9uPAUngngbjAajCqAjKQ4V0URBeXv7ogIXwYHv0DazPNXaqtNb9tPcejLVQzTlLl7z84s2nuQuSM23sTSWQ1TbMIe5Hq1kVqlixKcEOlWXiVpUrkuXlK3ZBb--CAT9luzxz-Uk_918iVJE0_CCMp_GQFIkMlQv06c4rVMsiJ0ss-iwcCqno02tLy7hEhy5nFSYxGQt1loeL"/>
</div>
<div class="flex-1">
<p class="text-sm font-bold">陳大文 (David Chen)</p>
<p class="text-xs text-slate-500 dark:text-slate-400">環球科技股份有限公司</p>
</div>
<button class="size-8 flex items-center justify-center rounded-lg text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" title="開啟聯絡人詳情">
<span class="material-symbols-outlined text-[18px]">open_in_new</span>
</button>
</div>
</div>
<!-- Validation Error Example (Hidden by default, shown for demonstration) -->
<div class="p-3 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-lg flex items-start gap-2">
<span class="material-symbols-outlined text-red-500 text-[18px]">error</span>
<p class="text-xs text-red-600 dark:text-red-400 font-medium">請輸入任務標題，此欄位不能為空。</p>
</div>
</div>
<!-- Footer Actions -->
<footer class="p-6 border-t border-slate-100 dark:border-slate-800 flex items-center gap-3 bg-white dark:bg-background-dark">
<button class="flex-1 px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 font-bold text-sm hover:bg-slate-50 dark:hover:bg-slate-800 transition-all">
                    取消
                </button>
<button class="flex-[2] px-4 py-3 rounded-xl bg-primary text-white font-bold text-sm shadow-lg shadow-primary/20 hover:bg-primary/90 transition-all">
                    儲存變更
                </button>
</footer>
</div>
</div>
</body></html>
